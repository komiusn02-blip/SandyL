<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, height=device-height">
    <title>Private Chat - Like WhatsApp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #075E54;
        }

        /* Main Container - Full Screen */
        .app-container {
            width: 100%;
            height: 100vh;
            height: -webkit-fill-available;
            background: #fff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header WhatsApp Style */
        .whatsapp-header {
            background: #075E54;
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-icon:active {
            background: rgba(255,255,255,0.2);
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
        }

        .header-right {
            display: flex;
            gap: 8px;
        }

        .header-icon {
            font-size: 22px;
            cursor: pointer;
            background: none;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-icon:active {
            background: rgba(255,255,255,0.2);
        }

        /* Stories Row */
        .stories-container {
            background: white;
            padding: 12px 16px;
            border-bottom: 1px solid #e9ecef;
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            gap: 16px;
            scrollbar-width: thin;
            flex-shrink: 0;
        }

        .story-item {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            position: relative;
        }

        .story-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #d62976, #962fbf);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .story-avatar-inner {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .story-avatar-inner img {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            object-fit: cover;
        }

        .story-avatar-inner div {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            background: #25D366;
            color: white;
        }

        .story-add {
            background: #075E54;
            width: 66px;
            height: 66px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
        }

        .story-name {
            font-size: 12px;
            color: #111b21;
            max-width: 70px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: #f0f2f5;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            font-weight: 600;
            color: #667781;
        }

        .tab.active {
            color: #075E54;
            border-bottom: 3px solid #075E54;
        }

        /* Lists Container */
        .lists-container {
            flex: 1;
            overflow-y: auto;
            background: #f0f2f5;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            background: white;
            border-bottom: 1px solid #e9ecef;
            cursor: pointer;
        }

        .contact-item:active {
            background: #f0f2f5;
        }

        .avatar-img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #25D366;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 22px;
            color: white;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }
        
        .contact-name {
            font-weight: 600;
            font-size: 16px;
            color: #111b21;
        }
        
        .contact-message {
            font-size: 13px;
            color: #667781;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ========== CHAT AREA - PERBAIKAN UTAMA ========== */
        .chat-area {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #efeae2;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 20;
        }

        .chat-area.open {
            transform: translateX(0);
        }

        /* Chat Header - FIXED TIDAK SCROLL */
        .chat-header {
            background: #075E54;
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            z-index: 5;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn:active {
            background: rgba(255,255,255,0.2);
        }

        .chat-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #25D366;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
            overflow: hidden;
            flex-shrink: 0;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-info {
            flex: 1;
        }

        .chat-info h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .chat-status {
            font-size: 12px;
            opacity: 0.85;
        }

        /* ========== CHAT MESSAGES - HANYA INI YANG SCROLL ========== */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            /* Background seperti WhatsApp */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23efeae2"/><circle cx="20" cy="20" r="2" fill="%23d1d7db" opacity="0.5"/><circle cx="80" cy="40" r="1.5" fill="%23d1d7db" opacity="0.5"/><circle cx="40" cy="80" r="2" fill="%23d1d7db" opacity="0.5"/><circle cx="70" cy="15" r="1.5" fill="%23d1d7db" opacity="0.5"/><circle cx="10" cy="70" r="1.8" fill="%23d1d7db" opacity="0.5"/></svg>');
            background-repeat: repeat;
            -webkit-overflow-scrolling: touch;
        }

        /* Message Bubbles */
        .message {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 8px;
            animation: fadeIn 0.2s ease;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-sent {
            background: #dcf8c5;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message-received {
            background: white;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message-text {
            font-size: 14px;
            color: #111b21;
            line-height: 1.4;
        }

        .message-time {
            font-size: 10px;
            color: #667781;
            margin-top: 4px;
            text-align: right;
        }

        /* ========== CHAT INPUT - TETAP DI BAWAH ========== */
        .chat-input-area {
            background: #f0f2f5;
            padding: 10px 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
            border-top: 1px solid #e0e0e0;
            z-index: 5;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 25px;
            outline: none;
            font-size: 15px;
            background: white;
        }

        .chat-input-area input:focus {
            outline: none;
        }

        .chat-input-area button {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: #075E54;
            color: white;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .chat-input-area button:active {
            background: #128C7E;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #667781;
        }

        .hidden {
            display: none;
        }

        /* Drawer Menu */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            display: none;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 85%;
            max-width: 320px;
            background: white;
            z-index: 101;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            background: #075E54;
            padding: 30px 20px 20px;
            color: white;
            text-align: center;
        }

        .drawer-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #25D366;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            margin: 0 auto 16px;
            overflow: hidden;
        }

        .drawer-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .drawer-name {
            font-size: 20px;
            font-weight: 600;
        }

        .drawer-item {
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
        }

        /* Story Modal */
        .story-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 250;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
        }

        .story-modal.open {
            visibility: visible;
            opacity: 1;
        }

        .story-modal-content {
            background: white;
            border-radius: 20px;
            padding: 24px;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        .story-preview {
            width: 100%;
            max-height: 300px;
            border-radius: 12px;
            margin-bottom: 16px;
            object-fit: cover;
        }

        .media-type-selector {
            display: flex;
            gap: 10px;
            margin: 16px 0;
        }

        .media-type-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #075E54;
            background: white;
            border-radius: 10px;
            cursor: pointer;
        }

        .media-type-btn.active {
            background: #075E54;
            color: white;
        }

        /* Story Viewer */
        .story-viewer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: black;
            z-index: 300;
            display: flex;
            flex-direction: column;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.3s, opacity 0.3s;
        }

        .story-viewer.open {
            visibility: visible;
            opacity: 1;
        }

        .story-viewer-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .story-viewer-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            cursor: pointer;
        }

        .story-media {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 16px;
            object-fit: contain;
        }

        .story-progress {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255,255,255,0.3);
        }

        .story-progress-bar {
            height: 100%;
            background: white;
            width: 0%;
            transition: width 0.1s linear;
        }

        .story-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            border: none;
            color: white;
            font-size: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 2;
        }

        /* Auth Forms */
        .auth-container {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #075E54 0%, #128C7E 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: white;
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%;
            max-width: 360px;
        }

        .auth-card h2 {
            color: #075E54;
            text-align: center;
            margin-bottom: 8px;
        }

        .auth-card p {
            text-align: center;
            color: #667781;
            margin-bottom: 24px;
        }

        .auth-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
        }

        .auth-input:focus {
            border-color: #075E54;
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background: #075E54;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-btn:active {
            background: #128C7E;
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
            color: #667781;
            font-size: 14px;
        }

        .auth-link a {
            color: #075E54;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .password-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        /* Scrollbar */
        .lists-container::-webkit-scrollbar,
        .chat-messages::-webkit-scrollbar,
        .stories-container::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        .lists-container::-webkit-scrollbar-track,
        .chat-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .lists-container::-webkit-scrollbar-thumb,
        .chat-messages::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        /* Android Safe Area */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .chat-input-area {
                padding-bottom: calc(10px + env(safe-area-inset-bottom));
            }
            .whatsapp-header {
                padding-top: calc(12px + env(safe-area-inset-top));
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, update, get, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_xBiCUnwCbMdbixsy-upVuN5oMYmaifY",
            authDomain: "chtt-b6530.firebaseapp.com",
            databaseURL: "https://chtt-b6530-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chtt-b6530",
            storageBucket: "chtt-b6530.firebasestorage.app",
            messagingSenderId: "886977836258",
            appId: "1:886977836258:web:17f2c06624de29b952dabb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = null;
        let selectedChatUser = null;
        let messagesUnsubscribe = null;
        let currentStories = [];
        let currentStoryIndex = 0;
        let storyProgressInterval = null;
        let currentMediaType = 'image';

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getInitial(name) {
            return name ? name.charAt(0).toUpperCase() : '?';
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            const now = new Date();
            if (date.toDateString() === now.toDateString()) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
            return date.toLocaleDateString([], { day: 'numeric', month: 'short' });
        }

        window.togglePassword = function(fieldId) {
            const field = document.getElementById(fieldId);
            const icon = event.target;
            if (field.type === 'password') {
                field.type = 'text';
                icon.textContent = '🔓';
            } else {
                field.type = 'password';
                icon.textContent = '🔒';
            }
        };

        window.selectMediaType = function(type) {
            currentMediaType = type;
            document.querySelectorAll('.media-type-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            document.getElementById('storyData').value = '';
            document.getElementById('storyPreview').classList.add('hidden');
            document.getElementById('storyData').accept = type === 'image' ? 'image/*' : 'video/*';
        };

        // Register
        window.register = async function() {
            const username = document.getElementById('regUsername').value.trim().toLowerCase();
            const password = document.getElementById('regPassword').value;
            const fullname = document.getElementById('regFullname').value.trim();

            if (!username || !password || !fullname) {
                alert('Isi semua field!');
                return;
            }
            if (username.length < 3) {
                alert('Username minimal 3 karakter');
                return;
            }
            if (password.length < 4) {
                alert('Password minimal 4 karakter');
                return;
            }

            const userRef = ref(db, `users/${username}`);
            const snapshot = await get(userRef);
            if (snapshot.exists()) {
                alert('Username sudah digunakan!');
                return;
            }

            await set(userRef, {
                username, password, fullname,
                bio: "Halo! Saya menggunakan Private Chat",
                avatar: getInitial(fullname),
                photoURL: null,
                online: true,
                lastSeen: Date.now()
            });

            alert('Registrasi berhasil! Silakan login.');
            showLogin();
        };

        // Login
        window.login = async function() {
            const username = document.getElementById('loginUsername').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                alert('Masukkan username dan password!');
                return;
            }

            const userRef = ref(db, `users/${username}`);
            const snapshot = await get(userRef);
            if (!snapshot.exists()) {
                alert('User tidak ditemukan!');
                return;
            }

            const user = snapshot.val();
            if (user.password !== password) {
                alert('Password salah!');
                return;
            }

            currentUser = {
                username, fullname: user.fullname, bio: user.bio, 
                avatar: user.avatar, photoURL: user.photoURL
            };

            await update(ref(db, `users/${username}`), { online: true, lastSeen: Date.now() });
            loadMainApp();
        };

        // Logout
        window.logout = async function() {
            if (currentUser) {
                await update(ref(db, `users/${currentUser.username}`), { online: false, lastSeen: Date.now() });
            }
            currentUser = null;
            closeDrawer();
            showLogin();
        };

        // Create Story
        window.createStory = function() {
            document.getElementById('storyModal').classList.add('open');
            currentMediaType = 'image';
            document.getElementById('storyData').accept = 'image/*';
        };

        window.closeStoryModal = function() {
            document.getElementById('storyModal').classList.remove('open');
            document.getElementById('storyData').value = '';
            document.getElementById('storyPreview').classList.add('hidden');
            document.getElementById('storyPreview').src = '';
        };

        window.previewStoryMedia = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('storyPreview');
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        window.postStory = async function() {
            const fileInput = document.getElementById('storyData');
            const file = fileInput.files[0];
            if (!file) {
                alert('Pilih media untuk story!');
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(e) {
                const storyData = {
                    userId: currentUser.username,
                    userName: currentUser.fullname,
                    userAvatar: currentUser.photoURL || currentUser.avatar,
                    mediaUrl: e.target.result,
                    mediaType: currentMediaType,
                    timestamp: Date.now(),
                    expiresAt: Date.now() + (24 * 60 * 60 * 1000),
                    viewedBy: {}
                };

                const storyRef = push(ref(db, 'stories'));
                await set(storyRef, storyData);
                alert('Story berhasil diposting!');
                closeStoryModal();
            };
            reader.readAsDataURL(file);
        };

        // View Story
        window.viewStory = async function(stories, index) {
            currentStories = stories;
            currentStoryIndex = index;
            
            const story = currentStories[currentStoryIndex];
            
            if (story.viewedBy && story.viewedBy[currentUser.username]) {
                alert('Story sudah pernah dilihat!');
                return;
            }
            
            const storyRef = ref(db, `stories/${story.id}/viewedBy/${currentUser.username}`);
            await set(storyRef, true);
            
            document.getElementById('storyViewer').classList.add('open');
            showCurrentStory();
            startStoryProgress();
        };

        async function deleteStoryAfterView(storyId) {
            await remove(ref(db, `stories/${storyId}`));
        }

        function showCurrentStory() {
            const story = currentStories[currentStoryIndex];
            const mediaElement = document.getElementById('storyMedia');
            
            document.getElementById('storyUserName').innerText = story.userName;
            
            if (story.mediaType === 'video') {
                mediaElement.innerHTML = `<video id="storyVideo" class="story-media" autoplay playsinline onended="closeStoryViewerAndDelete()" src="${story.mediaUrl}"></video>`;
                const video = document.getElementById('storyVideo');
                if (video) video.load();
            } else {
                mediaElement.innerHTML = `<img id="storyImage" class="story-media" src="${story.mediaUrl}" alt="Story">`;
            }
        }

        function startStoryProgress() {
            if (storyProgressInterval) clearInterval(storyProgressInterval);
            
            const story = currentStories[currentStoryIndex];
            let duration = 5000;
            
            if (story.mediaType === 'video') {
                const video = document.getElementById('storyVideo');
                if (video && video.duration) duration = video.duration * 1000;
            }
            
            let progress = 0;
            const bar = document.getElementById('storyProgressBar');
            bar.style.width = '0%';
            const intervalTime = 50;
            const step = (intervalTime / duration) * 100;
            
            storyProgressInterval = setInterval(() => {
                progress += step;
                bar.style.width = Math.min(progress, 100) + '%';
                if (progress >= 100) {
                    clearInterval(storyProgressInterval);
                    closeStoryViewerAndDelete();
                }
            }, intervalTime);
        }

        window.closeStoryViewerAndDelete = async function() {
            if (storyProgressInterval) clearInterval(storyProgressInterval);
            
            if (currentStories && currentStories[currentStoryIndex]) {
                await deleteStoryAfterView(currentStories[currentStoryIndex].id);
            }
            
            document.getElementById('storyViewer').classList.remove('open');
            currentStories = [];
            loadStories();
        };

        window.nextStory = async function() {
            if (currentStories && currentStories[currentStoryIndex]) {
                await deleteStoryAfterView(currentStories[currentStoryIndex].id);
            }
            
            if (currentStoryIndex < currentStories.length - 1) {
                currentStoryIndex++;
                showCurrentStory();
                startStoryProgress();
            } else {
                closeStoryViewerAndDelete();
            }
        };

        window.prevStory = async function() {
            if (currentStoryIndex > 0) {
                if (currentStories && currentStories[currentStoryIndex]) {
                    await deleteStoryAfterView(currentStories[currentStoryIndex].id);
                }
                currentStoryIndex--;
                showCurrentStory();
                startStoryProgress();
            }
        };

        // Load Stories
        async function loadStories() {
            const storiesRef = ref(db, 'stories');
            const now = Date.now();
            
            onValue(storiesRef, async (snapshot) => {
                const stories = snapshot.val();
                const storiesContainer = document.getElementById('storiesList');
                if (!storiesContainer) return;
                
                let activeStories = [];
                if (stories) {
                    activeStories = Object.entries(stories)
                        .filter(([id, story]) => {
                            if (story.expiresAt <= now) return false;
                            if (story.viewedBy && story.viewedBy[currentUser.username]) return false;
                            return true;
                        })
                        .map(([id, story]) => ({ id, ...story }));
                }
                
                if (stories) {
                    Object.entries(stories).forEach(([id, story]) => {
                        if (story.expiresAt <= now) {
                            remove(ref(db, `stories/${id}`));
                        }
                    });
                }
                
                const userStories = {};
                activeStories.forEach(story => {
                    if (!userStories[story.userId]) {
                        userStories[story.userId] = [];
                    }
                    userStories[story.userId].push(story);
                });
                
                let storiesHtml = `
                    <div class="story-item" onclick="createStory()">
                        <div class="story-avatar"><div class="story-add">+</div></div>
                        <div class="story-name">My Story</div>
                    </div>
                `;
                
                for (const [userId, userStoryList] of Object.entries(userStories)) {
                    if (userId === currentUser.username) continue;
                    
                    const userRef = ref(db, `users/${userId}`);
                    const userSnap = await get(userRef);
                    const user = userSnap.val();
                    if (!user) continue;
                    
                    const firstStory = userStoryList[0];
                    const previewUrl = firstStory.mediaUrl;
                    
                    storiesHtml += `
                        <div class="story-item" onclick="viewStory(${JSON.stringify(userStoryList)}, 0)">
                            <div class="story-avatar">
                                <div class="story-avatar-inner">
                                    ${previewUrl ? `<img src="${previewUrl}">` : (user.photoURL ? `<img src="${user.photoURL}">` : `<div>${user.avatar}</div>`)}
                                </div>
                            </div>
                            <div class="story-name">${escapeHtml(user.fullname.split(' ')[0])}</div>
                        </div>
                    `;
                }
                
                storiesContainer.innerHTML = storiesHtml;
            });
        }

        // Send Message
        window.sendMessage = async function() {
            if (!selectedChatUser) return;
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            const chatId = [currentUser.username, selectedChatUser.username].sort().join('_');
            const message = {
                from: currentUser.username,
                to: selectedChatUser.username,
                text: text,
                timestamp: Date.now()
            };
            await push(ref(db, `messages/${chatId}`), message);
            input.value = '';
            
            await update(ref(db, `userChats/${currentUser.username}/${selectedChatUser.username}`), {
                lastMessage: text,
                lastMessageTime: Date.now(),
                lastMessageFrom: currentUser.username
            });
            await update(ref(db, `userChats/${selectedChatUser.username}/${currentUser.username}`), {
                lastMessage: text,
                lastMessageTime: Date.now(),
                lastMessageFrom: currentUser.username
            });
        };

        // UI Functions
        function toggleDrawer() {
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('drawerOverlay');
            drawer.classList.toggle('open');
            overlay.style.display = drawer.classList.contains('open') ? 'block' : 'none';
        }

        function closeDrawer() {
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('drawerOverlay');
            drawer.classList.remove('open');
            overlay.style.display = 'none';
        }

        window.switchTab = function(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if (tab === 'chats') {
                document.getElementById('tabChats').classList.add('active');
                document.getElementById('usersList').classList.add('hidden');
                document.getElementById('chatsList').classList.remove('hidden');
                loadChatsList();
            } else {
                document.getElementById('tabUsers').classList.add('active');
                document.getElementById('usersList').classList.remove('hidden');
                document.getElementById('chatsList').classList.add('hidden');
                loadUsersList();
            }
        };

        function loadMainApp() {
            const appDiv = document.getElementById('app');
            appDiv.innerHTML = `
                <div class="app-container">
                    <div class="whatsapp-header">
                        <div class="header-left">
                            <button class="menu-icon" onclick="toggleDrawer()">☰</button>
                            <span class="header-title">ChatApp</span>
                        </div>
                        <div class="header-right">
                            <button class="header-icon" onclick="createStory()">⭐</button>
                            <button class="header-icon" onclick="logout()">🚪</button>
                        </div>
                    </div>

                    <div class="stories-container" id="storiesList"></div>

                    <div class="tabs">
                        <div class="tab active" id="tabChats" onclick="switchTab('chats')">Chats</div>
                        <div class="tab" id="tabUsers" onclick="switchTab('users')">Users</div>
                    </div>

                    <div class="lists-container">
                        <div id="chatsList"></div>
                        <div id="usersList" class="hidden"></div>
                    </div>

                    <!-- Drawer -->
                    <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
                    <div class="drawer" id="drawer">
                        <div class="drawer-header">
                            <div class="drawer-avatar">
                                ${currentUser.photoURL ? `<img src="${currentUser.photoURL}">` : currentUser.avatar}
                            </div>
                            <div class="drawer-name">${escapeHtml(currentUser.fullname)}</div>
                            <div>@${currentUser.username}</div>
                        </div>
                        <div class="drawer-item" onclick="closeDrawer(); createStory()">
                            <span>⭐</span> <span>Add Story</span>
                        </div>
                    </div>

                    <!-- Story Modal -->
                    <div class="story-modal" id="storyModal">
                        <div class="story-modal-content">
                            <h3>Add Story</h3>
                            <div class="media-type-selector">
                                <button class="media-type-btn active" onclick="selectMediaType('image')">📷 Image</button>
                                <button class="media-type-btn" onclick="selectMediaType('video')">🎥 Video</button>
                            </div>
                            <input type="file" id="storyData" accept="image/*" onchange="previewStoryMedia(event)">
                            <img id="storyPreview" class="story-preview hidden">
                            <button class="auth-btn" onclick="postStory()">Post Story</button>
                            <button class="auth-btn" style="background:#9e9e9e; margin-top:8px;" onclick="closeStoryModal()">Cancel</button>
                        </div>
                    </div>

                    <!-- Story Viewer -->
                    <div class="story-viewer" id="storyViewer">
                        <div class="story-progress"><div class="story-progress-bar" id="storyProgressBar"></div></div>
                        <div class="story-viewer-header">
                            <span id="storyUserName" style="color:white; font-weight:bold;"></span>
                        </div>
                        <button class="story-close" onclick="closeStoryViewerAndDelete()">✕</button>
                        <div class="story-viewer-content" id="storyViewerContent" onclick="nextStory()">
                            <div id="storyMedia"></div>
                        </div>
                    </div>

                    <!-- Chat Area -->
                    <div class="chat-area" id="chatArea">
                        <div class="chat-header">
                            <button class="back-btn" onclick="closeChat()">←</button>
                            <div class="chat-avatar" id="chatAvatar">?</div>
                            <div class="chat-info">
                                <h3 id="chatName">Loading...</h3>
                                <div class="chat-status" id="chatStatus">Online</div>
                            </div>
                        </div>
                        <div class="chat-messages" id="chatMessages">
                            <div class="empty-state">No messages yet</div>
                        </div>
                        <div class="chat-input-area">
                            <input type="text" id="chatInput" placeholder="Type a message" onkeypress="if(event.key==='Enter') sendMessage()">
                            <button onclick="sendMessage()">📤</button>
                        </div>
                    </div>
                </div>
            `;

            loadStories();
            loadChatsList();
            loadUsersList();
            setupUserStatusListener();
        }

        function setupUserStatusListener() {
            const usersRef = ref(db, 'users');
            onValue(usersRef, () => {
                if (selectedChatUser) {
                    get(ref(db, `users/${selectedChatUser.username}`)).then(snap => {
                        const user = snap.val();
                        if (user && document.getElementById('chatStatus')) {
                            document.getElementById('chatStatus').innerHTML = user.online ? '🟢 Online' : '⚫ Offline';
                        }
                    });
                }
            });
        }

        async function loadUsersList() {
            const usersRef = ref(db, 'users');
            onValue(usersRef, (snapshot) => {
                const users = snapshot.val();
                const container = document.getElementById('usersList');
                if (!container) return;
                
                if (!users) {
                    container.innerHTML = '<div class="empty-state">No users found</div>';
                    return;
                }

                const usersList = Object.values(users).filter(u => u.username !== currentUser.username);
                if (usersList.length === 0) {
                    container.innerHTML = '<div class="empty-state">No other users</div>';
                    return;
                }

                container.innerHTML = usersList.map(user => `
                    <div class="contact-item" onclick="openChat('${user.username}')">
                        <div class="avatar-img">
                            ${user.photoURL ? `<img src="${user.photoURL}">` : user.avatar}
                        </div>
                        <div class="contact-info">
                            <div class="contact-name">${escapeHtml(user.fullname)}</div>
                            <div class="contact-message">@${user.username}</div>
                        </div>
                    </div>
                `).join('');
            });
        }

        async function loadChatsList() {
            const chatsRef = ref(db, `userChats/${currentUser.username}`);
            onValue(chatsRef, async (snapshot) => {
                const chats = snapshot.val();
                const container = document.getElementById('chatsList');
                if (!container) return;

                if (!chats || Object.keys(chats).length === 0) {
                    container.innerHTML = '<div class="empty-state">No chats yet</div>';
                    return;
                }

                const chatList = await Promise.all(Object.keys(chats).map(async (username) => {
                    const userSnap = await get(ref(db, `users/${username}`));
                    const user = userSnap.val();
                    if (!user) return null;
                    return { username, ...user, ...chats[username] };
                }));

                const validChats = chatList.filter(c => c !== null);
                validChats.sort((a, b) => (b.lastMessageTime || 0) - (a.lastMessageTime || 0));

                container.innerHTML = validChats.map(chat => `
                    <div class="contact-item" onclick="openChat('${chat.username}')">
                        <div class="avatar-img">
                            ${chat.photoURL ? `<img src="${chat.photoURL}">` : chat.avatar}
                        </div>
                        <div class="contact-info">
                            <div class="contact-name">${escapeHtml(chat.fullname)}</div>
                            <div class="contact-message">
                                ${chat.lastMessage ? (chat.lastMessageFrom === currentUser.username ? 'You: ' : '') + escapeHtml(chat.lastMessage.substring(0, 30)) : 'Start chatting'}
                            </div>
                        </div>
                    </div>
                `).join('');
            });
        }

        window.openChat = async function(username) {
            selectedChatUser = { username };
            const userSnap = await get(ref(db, `users/${username}`));
            const user = userSnap.val();
            
            if (user) {
                document.getElementById('chatName').innerHTML = escapeHtml(user.fullname);
                const chatAvatar = document.getElementById('chatAvatar');
                if (user.photoURL) {
                    chatAvatar.innerHTML = `<img src="${user.photoURL}">`;
                } else {
                    chatAvatar.innerHTML = user.avatar;
                }
                document.getElementById('chatStatus').innerHTML = user.online ? '🟢 Online' : '⚫ Offline';
            }
            
            document.getElementById('chatArea').classList.add('open');
            loadMessages();
        };

        window.closeChat = function() {
            selectedChatUser = null;
            if (messagesUnsubscribe) messagesUnsubscribe();
            document.getElementById('chatArea').classList.remove('open');
        };

        function loadMessages() {
            if (messagesUnsubscribe) messagesUnsubscribe();
            const chatId = [currentUser.username, selectedChatUser.username].sort().join('_');
            const messagesRef = ref(db, `messages/${chatId}`);
            
            messagesUnsubscribe = onValue(messagesRef, (snapshot) => {
                const messages = snapshot.val();
                const container = document.getElementById('chatMessages');
                if (!container) return;
                
                if (!messages || Object.keys(messages).length === 0) {
                    container.innerHTML = '<div class="empty-state">✨ No messages yet. Start the conversation!</div>';
                    return;
                }
                
                const messagesList = Object.values(messages);
                messagesList.sort((a, b) => a.timestamp - b.timestamp);
                
                container.innerHTML = messagesList.map(msg => `
                    <div class="message ${msg.from === currentUser.username ? 'message-sent' : 'message-received'}">
                        <div class="message-text">${escapeHtml(msg.text)}</div>
                        <div class="message-time">${formatTime(msg.timestamp)}</div>
                    </div>
                `).join('');
                
                // Auto scroll ke bawah
                setTimeout(() => {
                    container.scrollTop = container.scrollHeight;
                }, 100);
            });
        }

        function showLogin() {
            const appDiv = document.getElementById('app');
            appDiv.innerHTML = `
                <div class="auth-container">
                    <div class="auth-card">
                        <h2>💬 Private Chat</h2>
                        <p>Secure & Real-time</p>
                        <div id="loginForm">
                            <input type="text" id="loginUsername" class="auth-input" placeholder="Username">
                            <div class="password-wrapper">
                                <input type="password" id="loginPassword" class="auth-input" placeholder="Password">
                                <button class="toggle-password" onclick="togglePassword('loginPassword')">🔒</button>
                            </div>
                            <button class="auth-btn" onclick="login()">Login</button>
                            <div class="auth-link">Don't have account? <a onclick="showRegister()">Register</a></div>
                        </div>
                        <div id="registerForm" class="hidden">
                            <input type="text" id="regUsername" class="auth-input" placeholder="Username">
                            <div class="password-wrapper">
                                <input type="password" id="regPassword" class="auth-input" placeholder="Password">
                                <button class="toggle-password" onclick="togglePassword('regPassword')">🔒</button>
                            </div>
                            <input type="text" id="regFullname" class="auth-input" placeholder="Full Name">
                            <button class="auth-btn" onclick="register()">Register</button>
                            <div class="auth-link">Already have account? <a onclick="showLogin()">Login</a></div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.showRegister = function() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
        };

        window.showLogin = function() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
        };

        showLogin();
    </script>
</body>
    </html>
